                <label for="">Segundo plato:</label>

            </div>

            <div>

            <div>
                <label for="">Precio:</label>
                <input id="price" type="text">
            </div>
        </div>

        <button id="edit-menu-btn">Editar menú</button>
        <button id="add-menu-btn">Añadir menú</button>
    </div>
